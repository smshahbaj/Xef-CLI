version: "2"

run:
  timeout: 5m
  go: "1.22"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - prealloc
  settings:
    govet:
      enable-all: true
    staticcheck:
      checks:
        - all
        - "-QF1008"
    revive:
      rules:
        - name: var-naming
          disabled: true
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0